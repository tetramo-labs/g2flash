name: Firmware vector tests

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install demo dependencies
        working-directory: demos
        run: bun install --frozen-lockfile
      - name: Run firmware and SVG protocol tests
        run: python3 patches/host/run_vector_tests.py --out /tmp/g2-vector-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-test-artifacts
          path: /tmp/g2-vector-tests
          retention-days: 7
